<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Platform</title>


<style>


*{

    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;

}



body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:white;

    overflow:hidden;

}




body::before{

    content:"";

    position:fixed;

    inset:0;


    background-image:

    linear-gradient(#3333 2px, transparent 2px),

    linear-gradient(90deg,#3333 2px, transparent 2px);



    background-size:50px 50px;


    animation:gridMove 6s linear infinite;


    z-index:-1;

}



@keyframes gridMove{


from{

background-position:0 0;

}


to{

background-position:0 50px;

}


}





button{


    width:100%;

    padding:12px;

    margin-top:12px;


    border:none;

    border-radius:8px;


    background:#222;

    color:white;


    cursor:pointer;


    transition:.15s;


}



button:hover{


    background:#444;

    transform:translateY(-2px) scale(1.03);


}



button:active{


    transform:scale(.97);


}






input{


    width:100%;

    padding:12px;

    margin-top:12px;


    border:2px solid #444;

    border-radius:8px;


}









/* LOGIN */


.account-box{


    width:360px;


    padding:35px;


    background:white;


    border:2px solid #444;


    border-radius:12px;


    text-align:center;


}









/* MAIN APP */


.app{


    display:none;


    width:900px;


    height:600px;


    background:white;


    border:2px solid #444;


    border-radius:12px;


    display:flex;


}









/* SIDEBAR */


.sidebar{


    width:250px;


    padding:20px;


    border-right:2px solid #444;


}




.profile{


    display:flex;


    align-items:center;


    gap:15px;


    margin-bottom:30px;


}




.avatar{


    width:55px;


    height:55px;


    border-radius:50%;


    background:#222;


    color:white;


    display:flex;


    justify-content:center;


    align-items:center;


    font-size:25px;


}




.friend-list{


    height:260px;


    border:2px solid #444;


    border-radius:10px;


    padding:10px;


}
.friend{


    display:flex;


    align-items:center;


    gap:10px;


    padding:10px;


    border-radius:8px;


    cursor:pointer;


}



.friend:hover{


    background:#eee;


}





.small-avatar{


    width:35px;


    height:35px;


    border-radius:50%;


    background:#222;


    color:white;


    display:flex;


    justify-content:center;


    align-items:center;


}









/* CHAT */


.chat{


    flex:1;


    padding:25px;


}



.chat-title{


    font-size:28px;


    margin-bottom:20px;


}





.empty-chat{


    height:420px;


    border:2px solid #444;


    border-radius:10px;


    display:flex;


    justify-content:center;


    align-items:center;


    color:#555;


}









/* SIDE PANELS */


.panel{


    display:none;


    position:fixed;


    top:50%;


    width:300px;


    background:white;


    border:2px solid #444;


    border-radius:12px;


    padding:25px;


    z-index:999;


}






.close{


    width:auto;


    float:right;


    padding:5px 12px;


}






.request{


    border:2px solid #444;


    border-radius:8px;


    padding:12px;


    margin-top:12px;


}



</style>


</head>




<body>






<!-- LOGIN -->


<div class="account-box" id="loginBox">


<h1>

Sign In

</h1>



<input id="username" placeholder="Username">



<input id="password" type="password" placeholder="Password">





<button onclick="login()">

Login

</button>




<button onclick="register()">

Sign Up

</button>





<p id="message"></p>



</div>









<!-- MAIN APP -->


<div class="app" id="app">





<div class="sidebar">





<div class="profile">


<div class="avatar" id="avatar">

?

</div>





<b id="displayName">

User

</b>



</div>







<h3>

Friends

</h3>







<div class="friend-list" id="friendList">


No friends yet


</div>






<button onclick="openAddFriend()">

+ Add Friend

</button>






<button onclick="openRequests()">

Friend Requests

</button>






<button onclick="openFriends()">

Friends Tab

</button>






<button onclick="logout()">

Logout

</button>




</div>









<div class="chat">


<h2 class="chat-title">

Chat

</h2>




<div class="empty-chat" id="chatBox">


Select a friend to start chatting


</div>



</div>







</div>









<!-- ADD FRIEND PANEL -->


<div class="panel" id="addPanel">


<button class="close" onclick="closePanels()">

X

</button>




<h2>

Add Friend

</h2>




<input id="friendUsername" placeholder="Username">





<button onclick="sendRequest()">

Send Request

</button>





<p id="friendResult"></p>



</div>









<!-- REQUEST PANEL -->


<div class="panel" id="requestPanel">


<button class="close" onclick="closePanels()">

X

</button>





<h2>

Friend Requests

</h2>




<div id="requests">


</div>



</div>









<!-- FRIENDS PANEL -->


<div class="panel" id="friendsPanel">


<button class="close" onclick="closePanels()">

X

</button>





<h2>

Friends

</h2>




<div id="friends">


</div>



</div>
<script>


let currentUser = "";

let requestTimer;








// KEEP LOGIN AFTER REFRESH


window.onload=function(){


    let savedUser=localStorage.getItem("username");



    if(savedUser){


        currentUser=savedUser;



        loginBox.style.display="none";


        app.style.display="flex";



        displayName.innerText=savedUser;


        avatar.innerText=savedUser[0].toUpperCase();



        startRequestChecker();



        loadFriends();



    }


};









// REGISTER


async function register(){



    let username=document.getElementById("username").value;


    let password=document.getElementById("password").value;




    let response=await fetch("/register",{


        method:"POST",


        headers:{


            "Content-Type":"application/json"


        },


        body:JSON.stringify({


            username,

            password


        })



    });




    let data=await response.json();



    message.innerText=data.message;



}









// LOGIN


async function login(){



    let username=document.getElementById("username").value;


    let password=document.getElementById("password").value;







    let response=await fetch("/login",{


        method:"POST",


        headers:{


            "Content-Type":"application/json"


        },


        body:JSON.stringify({


            username,

            password


        })



    });






    let data=await response.json();





    if(data.success){



        currentUser=data.user.username;



        localStorage.setItem(
            "username",
            currentUser
        );



        loginBox.style.display="none";


        app.style.display="flex";



        avatar.innerText=data.user.avatar;


        displayName.innerText=currentUser;



        startRequestChecker();


        loadFriends();



    }

    else{


        message.innerText=data.message;


    }



}









// LOGOUT


function logout(){



    localStorage.removeItem("username");


    clearInterval(requestTimer);


    location.reload();


}









// OPEN PANELS


function openAddFriend(){


    closePanels();



    addPanel.style.display="block";


    addPanel.style.left="20px";


    addPanel.style.transform="translateY(-50%)";


}






function openRequests(){



    closePanels();



    requestPanel.style.display="block";


    requestPanel.style.right="20px";


    requestPanel.style.transform="translateY(-50%)";



    loadRequests();



}







function openFriends(){



    closePanels();



    friendsPanel.style.display="block";


    friendsPanel.style.left="20px";


    friendsPanel.style.transform="translateY(-50%)";



    loadFriends();



}






function closePanels(){


    addPanel.style.display="none";


    requestPanel.style.display="none";


    friendsPanel.style.display="none";


}









// SEND FRIEND REQUEST


async function sendRequest(){



    let username=document.getElementById("friendUsername").value;




    let response=await fetch("/send-request",{



        method:"POST",



        headers:{


            "Content-Type":"application/json"


        },



        body:JSON.stringify({


            from:currentUser,


            to:username


        })



    });





    let data=await response.json();



    friendResult.innerText=data.message;



}









// REQUEST AUTO CHECK


function startRequestChecker(){



    if(requestTimer)

        clearInterval(requestTimer);





    requestTimer=setInterval(()=>{


        if(currentUser){


            loadRequests();


        }



    },3000);



}









// LOAD REQUESTS


async function loadRequests(){



    if(!currentUser)return;





    let response=await fetch("/get-requests",{


        method:"POST",


        headers:{


            "Content-Type":"application/json"


        },


        body:JSON.stringify({


            username:currentUser


        })


    });





    let data=await response.json();





    requests.innerHTML="";





    if(!data.requests || data.requests.length===0){


        requests.innerHTML="<p>No requests</p>";


        return;


    }






    data.requests.forEach(user=>{



        requests.innerHTML+=`


        <div class="request">


        <div class="small-avatar">

        ${user.avatar}

        </div>


        <b>${user.username}</b>



        <button onclick="acceptRequest('${user.username}')">

        Accept

        </button>



        <button onclick="declineRequest('${user.username}')">

        Decline

        </button>


        </div>


        `;


    });



}









// ACCEPT REQUEST


async function acceptRequest(user){



    await fetch("/accept-request",{



        method:"POST",


        headers:{


            "Content-Type":"application/json"


        },


        body:JSON.stringify({


            username:currentUser,


            requester:user


        })



    });



    loadRequests();


    loadFriends();



}









// DECLINE REQUEST


async function declineRequest(user){



    await fetch("/decline-request",{



        method:"POST",


        headers:{


            "Content-Type":"application/json"


        },


        body:JSON.stringify({


            username:currentUser,


            requester:user


        })



    });





    loadRequests();



}









// LOAD FRIENDS


async function loadFriends(){



    if(!currentUser)return;





    let response=await fetch("/get-friends",{



        method:"POST",



        headers:{


            "Content-Type":"application/json"


        },



        body:JSON.stringify({


            username:currentUser


        })


    });





    let data=await response.json();





    friends.innerHTML="";





    if(!data.friends || data.friends.length===0){



        friends.innerHTML="<p>No friends yet</p>";


        return;


    }






    data.friends.forEach(friend=>{



        friends.innerHTML+=`



        <div class="friend" onclick="openChat('${friend.username}')">


            <div class="small-avatar">

            ${friend.avatar}

            </div>



            <b>${friend.username}</b>


        </div>



        `;



    });



}









// OPEN CHAT


function openChat(username){



    closePanels();



    chatBox.innerHTML=`



    <h2>

    Chat with ${username}

    </h2>



    <p>

    Chat system coming next 🚀

    </p>



    `;



}



</script>


</body>

</html>
