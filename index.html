<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Website</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    overflow-x:hidden;
}

header{
    padding:20px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:30px;
    font-weight:bold;
    color:#38bdf8;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:25px;
    transition:.3s;
}

nav a:hover{
    color:#38bdf8;
}

.hero{
    height:85vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.hero h1{
    font-size:60px;
    margin-bottom:20px;
}

.hero p{
    font-size:22px;
    max-width:700px;
    color:#cbd5e1;
}

button{
    margin-top:35px;
    padding:15px 35px;
    border:none;
    border-radius:10px;
    background:#38bdf8;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.08);
    background:#0ea5e9;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
    padding:80px 8%;
}

.card{
    background:#1e293b;
    padding:30px;
    border-radius:15px;
    transition:.3s;
}

.card:hover{
    transform:translateY(-8px);
}

footer{
    text-align:center;
    padding:30px;
    color:#94a3b8;
}
</style>

</head>
<body>

<header>
<div class="logo">MySite</div>

<nav>
<a href="#">Home</a>
<a href="#">About</a>
<a href="#">Projects</a>
<a href="#">Contact</a>
</nav>
</header>

<section class="hero">
<h1>Welcome</h1>
<p>A clean, modern website built with HTML, CSS, and JavaScript.</p>

<button onclick="sayHello()">Get Started</button>
</section>

<section class="cards">

<div class="card">
<h2>Fast</h2>
<p>Loads quickly and works on desktop and mobile.</p>
</div>

<div class="card">
<h2>Modern</h2>
<p>Simple design with smooth hover animations.</p>
</div>

<div class="card">
<h2>Customizable</h2>
<p>You can easily change the colors, text, and layout.</p>
</div>

</section>

<footer>
© 2026 My Website
</footer>

<script>
function sayHello(){
    alert("Thanks for visiting!");
}
</script>

</body>
</html>
