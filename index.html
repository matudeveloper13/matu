<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Platform</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}


body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:white;

    overflow:hidden;

    transition:.3s;

}



/* MOVING GRID */


body::before{

    content:"";

    position:fixed;

    inset:0;


    background-image:

    linear-gradient(#3333 2px,transparent 2px),

    linear-gradient(90deg,#3333 2px,transparent 2px);


    background-size:50px 50px;


    animation:gridMove 6s linear infinite;


    z-index:-1;

}



@keyframes gridMove{

from{

background-position:0 0;

}


to{

background-position:0 50px;

}

}







/* TOP BUTTONS */


.discord-button{

position:fixed;

top:20px;

left:20px;

}


.discord-button img{

width:55px;

height:55px;

cursor:pointer;

}



.settings-button{

position:fixed;

top:25px;

left:90px;

font-size:30px;

cursor:pointer;

}






.settings-popup{


display:none;

position:fixed;


top:75px;

left:80px;


width:220px;


background:white;


border:3px solid #444;


border-radius:12px;


padding:15px;


z-index:999;


}









button{


width:100%;


padding:10px;


margin-top:8px;


border:none;


border-radius:8px;


background:#222;


color:white;


cursor:pointer;


transition:.15s;


}



button:hover{

background:#444;

transform:scale(1.03);

}



button:active{

transform:scale(.97);

}







input{


width:100%;


padding:12px;


margin-top:10px;


border:2px solid #444;


border-radius:8px;


}









/* LOGIN */


.account-box{


width:360px;


padding:35px;


background:white;


border:3px solid #444;


border-radius:12px;


text-align:center;


}









/* MAIN APP */


.app{


display:none;


width:950px;


height:620px;


background:white;


border:3px solid #444;


border-radius:12px;


overflow:hidden;


}









/* SIDEBAR */


.sidebar{


width:260px;


padding:20px;


border-right:3px solid #444;


}





.profile{


display:flex;


align-items:center;


gap:15px;


margin-bottom:25px;


}





.avatar{


width:55px;


height:55px;


border-radius:50%;


background:#222;


color:white;


display:flex;


justify-content:center;


align-items:center;


font-size:25px;


}





.friend-list{


height:300px;


border:3px solid #444;


border-radius:10px;


padding:10px;


overflow:auto;


}



.friend{


display:flex;


align-items:center;


gap:10px;


padding:10px;


border-radius:8px;


cursor:pointer;


}



.friend:hover{


background:#eee;


}





.small-avatar{


width:35px;


height:35px;


border-radius:50%;


background:#222;


color:white;


display:flex;


justify-content:center;


align-items:center;


}

/* CHAT */


.chat{

flex:1;

padding:25px;

}



.chat-title{

font-size:28px;

margin-bottom:15px;

}






.chat-box{


height:420px;


border:3px solid #444;


border-radius:10px;


padding:15px;


overflow-y:auto;


display:flex;


flex-direction:column;


}





.message{


max-width:70%;


padding:10px 15px;


margin:8px;


border-radius:18px;


word-wrap:break-word;


}





.my-message{


background:#222;


color:white;


align-self:flex-end;


}





.friend-message{


background:#eee;


color:black;


align-self:flex-start;


}







.chat-input{


display:flex;


gap:8px;


margin-top:15px;


position:relative;


}





.chat-input input{


flex:1;


margin:0;


}



.chat-input button{


width:70px;


}









/* EMOJIS */


.emoji-box{


display:none;


position:absolute;


bottom:55px;


right:80px;


background:white;


border:3px solid #444;


border-radius:12px;


padding:10px;


font-size:25px;


}



.emoji-box span{


cursor:pointer;


margin:5px;


}









/* PANELS */


.panel{


display:none;


position:fixed;


top:50%;


width:320px;


background:white;


border:3px solid #444;


border-radius:12px;


padding:25px;


z-index:100;


}




.close{


width:auto;


float:right;


padding:5px 12px;


}



.request{


border:2px solid #444;


border-radius:8px;


padding:12px;


margin-top:12px;


}








/* DARK MODE */


body.dark{


background:#121212;

color:white;

}




body.dark::before{


background-image:


linear-gradient(#ffffff55 2px,transparent 2px),


linear-gradient(90deg,#ffffff55 2px,transparent 2px);


}





body.dark .account-box,

body.dark .app,

body.dark .panel,

body.dark .settings-popup{


background:#20232a;

color:white;

border-color:#555;


}






body.dark input{


background:#101216;

color:white;

border-color:#555;


}







body.dark button{


background:#111;


}



body.dark button:hover{


background:#333;


}






body.dark .friend:hover{


background:#333;


}







body.dark .friend-message{


background:#333;

color:white;

}







</style>


</head>





<body>








<!-- DISCORD -->


<a class="discord-button" href="https://discord.gg/rjQTCETjQF" target="_blank">

<img src="discord.png">

</a>








<!-- SETTINGS -->


<div class="settings-button" onclick="openSettings()">

⚙️

</div>






<div class="settings-popup" id="settingsPopup">


<h3>Settings</h3>


<button onclick="darkMode()">

🌙 Dark Mode

</button>



<button onclick="lightMode()">

☀️ Light Mode

</button>



</div>









<!-- LOGIN -->


<div class="account-box" id="loginBox">


<h1>Sign In</h1>



<input id="username" placeholder="Username">


<input id="password" type="password" placeholder="Password">





<button onclick="login()">

Login

</button>



<button onclick="register()">

Sign Up

</button>




<p id="message"></p>



</div>














<!-- APP -->


<div class="app" id="app">






<div class="sidebar">



<div class="profile">


<div class="avatar" id="avatar">

?

</div>


<b id="displayName">

User

</b>


</div>






<h3>

Friends

</h3>






<div class="friend-list" id="friendList">


No friends yet


</div>






<button onclick="openAddFriend()">

+ Add Friend

</button>






<button onclick="openRequests()">

Friend Requests

</button>






<button onclick="logout()">

Logout

</button>







</div>












<div class="chat">



<h2 class="chat-title" id="chatTitle">

Chat

</h2>





<div class="chat-box" id="chatBox">

Select a friend to start chatting

</div>







<div class="chat-input">



<input id="messageInput" placeholder="Type a message...">





<button onclick="openEmoji()">

😀

</button>




<button onclick="sendMessage()">

Send

</button>







<div class="emoji-box" id="emojiBox">


<span onclick="addEmoji('😀')">😀</span>

<span onclick="addEmoji('😂')">😂</span>

<span onclick="addEmoji('❤️')">❤️</span>

<span onclick="addEmoji('🔥')">🔥</span>

<span onclick="addEmoji('👍')">👍</span>


</div>





</div>






</div>







</div>












<!-- ADD FRIEND -->


<div class="panel" id="addPanel">


<button class="close" onclick="closePanels()">

X

</button>



<h2>

Add Friend

</h2>



<input id="friendUsername" placeholder="Username">



<button onclick="sendRequest()">

Send Request

</button>



<p id="friendResult"></p>



</div>








<!-- REQUESTS -->


<div class="panel" id="requestPanel">


<button class="close" onclick="closePanels()">

X

</button>



<h2>

Friend Requests

</h2>




<div id="requests">

</div>




</div>
<script>


let currentUser="";
let currentFriend="";

let chatInterval;
let updateInterval;







// =====================
// SETTINGS
// =====================


function openSettings(){

if(settingsPopup.style.display==="block"){

settingsPopup.style.display="none";

}

else{

settingsPopup.style.display="block";

}

}



function darkMode(){

document.body.classList.add("dark");

localStorage.setItem("theme","dark");

}



function lightMode(){

document.body.classList.remove("dark");

localStorage.setItem("theme","light");

}




if(localStorage.getItem("theme")==="dark"){

document.body.classList.add("dark");

}









// =====================
// REGISTER
// =====================


async function register(){


let username=document.getElementById("username").value.trim();

let password=document.getElementById("password").value;



let res=await fetch("/register",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

username,

password

})

});



let data=await res.json();



message.innerText=data.message;


}









// =====================
// LOGIN
// =====================


async function login(){


let username=document.getElementById("username").value.trim();


let password=document.getElementById("password").value;



let res=await fetch("/login",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

username,

password

})

});



let data=await res.json();




if(data.success){


currentUser=data.user.username;



loginBox.style.display="none";

app.style.display="flex";



displayName.innerText=currentUser;

avatar.innerText=data.user.avatar;



loadFriends();

loadRequests();




updateInterval=setInterval(()=>{


loadFriends();

loadRequests();


},3000);



}

else{


message.innerText=data.message;


}



}









// =====================
// LOGOUT
// =====================


function logout(){


currentUser="";

currentFriend="";



clearInterval(chatInterval);

clearInterval(updateInterval);



closePanels();



emojiBox.style.display="none";



app.style.display="none";


loginBox.style.display="block";



chatBox.innerHTML="Select a friend to start chatting";


chatTitle.innerText="Chat";



}











// =====================
// PANELS
// =====================


function closePanels(){


addPanel.style.display="none";


requestPanel.style.display="none";


settingsPopup.style.display="none";


}






function openAddFriend(){


closePanels();


addPanel.style.display="block";


addPanel.style.left="20px";


addPanel.style.transform="translateY(-50%)";


}






function openRequests(){


closePanels();


requestPanel.style.display="block";


requestPanel.style.right="20px";


requestPanel.style.transform="translateY(-50%)";


loadRequests();


}









// =====================
// SEND REQUEST
// =====================


async function sendRequest(){


let to=friendUsername.value.trim();



if(to===""){

friendResult.innerText="Enter username";

return;

}



let res=await fetch("/send-request",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

from:currentUser,

to

})

});



let data=await res.json();



if(data.success){

friendResult.innerText="✅ Request sent!";

}

else{

friendResult.innerText="❌ "+data.message;

}



}












// =====================
// LOAD REQUESTS
// =====================


async function loadRequests(){


if(!currentUser)
return;



let res=await fetch("/get-requests",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

username:currentUser

})

});



let data=await res.json();



requests.innerHTML="";



if(!data.requests || data.requests.length===0){


requests.innerText="No requests";


return;


}



data.requests.forEach(req=>{


let div=document.createElement("div");


div.className="request";



div.innerHTML=`

<b>${req.username}</b>

<button onclick="acceptRequest('${req.username}')">

Accept

</button>


<button onclick="declineRequest('${req.username}')">

Decline

</button>

`;



requests.appendChild(div);



});


}









async function acceptRequest(user){


await fetch("/accept-request",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

username:currentUser,

requester:user

})

});



loadRequests();

loadFriends();


}








async function declineRequest(user){


await fetch("/decline-request",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

username:currentUser,

requester:user

})

});



loadRequests();


}









// =====================
// FRIENDS
// =====================


async function loadFriends(){


if(!currentUser)
return;



let res=await fetch("/get-friends",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

username:currentUser

})

});



let data=await res.json();



friendList.innerHTML="";



if(!data.friends || data.friends.length===0){

friendList.innerText="No friends yet";

return;

}





let shown=[];



data.friends.forEach(friend=>{


if(friend.username===currentUser)
return;



if(shown.includes(friend.username))
return;



shown.push(friend.username);




let div=document.createElement("div");


div.className="friend";



div.innerHTML=`

<div class="small-avatar">

${friend.avatar}

</div>


${friend.username}

`;



div.onclick=()=>openChat(friend.username);



friendList.appendChild(div);



});



}









// =====================
// CHAT
// =====================


function openChat(friend){


currentFriend=friend;


chatTitle.innerText=friend;



loadMessages();



clearInterval(chatInterval);



chatInterval=setInterval(()=>{


loadMessages();


},2000);


}








async function sendMessage(){


if(!currentFriend)
return;



let text=messageInput.value.trim();



if(text==="")
return;



await fetch("/send-message",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

from:currentUser,

to:currentFriend,

message:text

})

});



messageInput.value="";



loadMessages();



}








messageInput.addEventListener("keydown",(e)=>{


if(e.key==="Enter"){

sendMessage();

}


});








async function loadMessages(){


if(!currentFriend)
return;



let res=await fetch("/get-messages",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

user:currentUser,

friend:currentFriend

})

});



let data=await res.json();



chatBox.innerHTML="";



data.messages.forEach(msg=>{


let div=document.createElement("div");



div.className=

msg.sender===currentUser

?

"message my-message"

:

"message friend-message";



div.innerText=msg.message;



chatBox.appendChild(div);



});



chatBox.scrollTop=chatBox.scrollHeight;


}









// =====================
// EMOJIS
// =====================


function openEmoji(){


if(emojiBox.style.display==="block"){

emojiBox.style.display="none";

}

else{

emojiBox.style.display="block";

}


}



function addEmoji(e){


messageInput.value+=e;


}



</script>
